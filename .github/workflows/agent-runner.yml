name: 'CodeFactoryAgent Reusable Runner'

on:
  workflow_call:
    inputs:
      jira_ticket_number:
        description: 'Jira Ticket Number (e.g. KAN-4 or DEMO-1)'
        required: true
        type: string
      gemini_model:
        description: 'Gemini model name'
        required: false
        type: string
        default: 'gemini-2.5-flash'
      mock_mode:
        description: 'Run in offline mock mode (testing without live credentials)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Simulate git push and PR creation without modifying remote repository'
        required: false
        type: boolean
        default: false
      java_version:
        description: 'Java runtime version for target app'
        required: false
        type: string
        default: '21'
    secrets:
      GOOGLE_API_KEY:
        required: false
      JIRA_BASE_URL:
        required: false
      JIRA_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false
      GH_PAT:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  execute-agent:
    name: 'Implement Jira Story'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for branching

      - name: Checkout CodeFactoryAgent Engine
        uses: actions/checkout@v4
        with:
          repository: anoopt-2026/code-factory
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}
          path: .code-factory-agent
          ref: main

      - name: Set up Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java_version }}
          cache: 'maven'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.code-factory-agent/requirements.txt'

      - name: Install Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .code-factory-agent/requirements.txt

      - name: Execute CodeFactoryAgent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ inputs.jira_ticket_number }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_REPO_DIR: ${{ github.workspace }}
          MOCK_MODE: ${{ inputs.mock_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.mock_mode }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --mock"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
          fi
          python .code-factory-agent/run_agent.py --ticket "${{ inputs.jira_ticket_number }}" --repo-dir "${{ github.workspace }}" --model "${{ inputs.gemini_model }}" $EXTRA_FLAGS
